name: convoy
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm

database:
  type: postgres
  version: "17"

nodejs_version: "22"
corepack_enable: false

# ext-gmp is required by composer.json (prod Dockerfile installs it too).
webimage_extra_packages:
  - php8.4-gmp

# Postgres + redis + mail overrides. These are real container env vars, so they
# take precedence over .env (Laravel's Dotenv does not overwrite existing env).
web_environment:
  - APP_URL=https://convoy.ddev.site
  - DB_CONNECTION=pgsql
  - DB_HOST=db
  - DB_PORT=5432
  - DB_DATABASE=db
  - DB_TEST_DATABASE=db_test
  - DB_USERNAME=db
  - DB_PASSWORD=db
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_PASSWORD=
  - CACHE_STORE=redis
  - QUEUE_CONNECTION=redis
  - SESSION_DRIVER=redis
  - MAIL_MAILER=smtp
  - MAIL_HOST=localhost
  - MAIL_PORT=1025

# The test suite (RefreshDatabase) runs against a separate `db_test` database so
# its migrate:fresh / sequence churn never touches dev data. Postgres has no
# CREATE DATABASE IF NOT EXISTS, so createdb is guarded to stay idempotent.
hooks:
  post-start:
    # Pin `db` in /etc/hosts to the real db container. Without this, the web
    # container's resolver (search domain + ndots:0) lets a bare `db` lookup fall
    # through to the sandbox host's wildcard DNS, which answers
    # `db.claude-panel.docker.internal` with a host-network Postgres — so PHP-FPM
    # and `ddev exec` end up on DIFFERENT databases (see docs/v10-next-handoff.md).
    # nsswitch checks `files` before DNS, so an /etc/hosts entry closes the hole.
    # Re-resolved every start, so it survives the container's IP drifting.
    - exec: "sudo bash -c 'H=$(getent hosts db | head -n1 | sed \"s/[[:space:]].*//\"); grep -qw db /etc/hosts || echo \"$H db\" >> /etc/hosts'"
    - exec: "PGPASSWORD=db createdb -h db -U db db_test 2>/dev/null || true"

# Replaces the compose `horizon` and `scheduler` services.
web_extra_daemons:
  - name: horizon
    command: "php artisan horizon"
    directory: /var/www/html
  - name: scheduler
    command: "php artisan schedule:work"
    directory: /var/www/html

# Expose the Vite dev server.
web_extra_exposed_ports:
  - name: vite
    container_port: 3000
    http_port: 3011
    https_port: 3000
