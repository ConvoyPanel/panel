name: convoy5x
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm

# Postgres 17, as in compose.yml.
database:
  type: postgres
  version: "17"

# Without this DDEV assigns a random ephemeral host port on every start, which
# breaks saved connections in GUI clients (TablePlus, DataGrip, psql aliases).
# 5436 because convoy (~/panel) holds 5432 and console 5435.
host_db_port: "5436"

# The Docker image builds the frontend on Node 22.
nodejs_version: "22"
corepack_enable: false

# ext-gmp is required by composer.json. Without it `composer install` fails its
# platform check -- and `ddev composer` still exits 0, so vendor/ silently stays
# stale and every artisan call dies on the next platform_check.php.
webimage_extra_packages:
  - php8.4-gmp
  # Shared libraries for Playwright's headless Chromium, so the e2e specs run the
  # browser in this container (Node lives here, not on the host). The browser
  # binary itself is installed by `ddev npm run test:e2e:install`.
  - fonts-liberation
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libatspi2.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libdrm2
  - libgbm1
  - libglib2.0-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2

# Database + redis + mail overrides. These are real container env vars, so they
# take precedence over .env (Laravel's Dotenv does not overwrite existing env).
# Note CACHE_DRIVER, not CACHE_STORE: this branch is on Laravel 11 but
# still ships the pre-11 config/cache.php, which reads the old key.
web_environment:
  - APP_URL=https://convoy5x.ddev.site
  - DB_CONNECTION=pgsql
  - DB_HOST=db
  - DB_PORT=5432
  - DB_DATABASE=db
  - DB_TEST_DATABASE=db_test
  - DB_USERNAME=db
  - DB_PASSWORD=db
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - REDIS_PASSWORD=
  - CACHE_DRIVER=redis
  - QUEUE_CONNECTION=redis
  - SESSION_DRIVER=redis
  - MAIL_MAILER=smtp
  - MAIL_HOST=localhost
  - MAIL_PORT=1025
  # Inside the mounted project, so the Playwright browser survives `ddev restart`
  # (the container's home directory does not). `npm ci` clears it with node_modules.
  - PLAYWRIGHT_BROWSERS_PATH=/var/www/html/node_modules/.cache/ms-playwright

# The test suite (RefreshDatabase) runs against a separate `db_test` database so
# its migrate:fresh never touches dev data; tests/bootstrap.php points the suite
# at DB_TEST_DATABASE. Postgres has no CREATE DATABASE IF NOT EXISTS, so
# createdb is guarded to stay idempotent.
hooks:
  post-start:
    - exec: "PGPASSWORD=db createdb -h db -U db db_test 2>/dev/null || true"

# Replaces compose.yml's `worker` and `scheduler` services.
web_extra_daemons:
  - name: horizon
    command: "php artisan horizon"
    directory: /var/www/html
  - name: scheduler
    command: "php artisan schedule:work"
    directory: /var/www/html

# Expose the Vite dev server, which vite.config.js pins to 1234.
web_extra_exposed_ports:
  - name: vite
    container_port: 1234
    http_port: 1235
    https_port: 1234
